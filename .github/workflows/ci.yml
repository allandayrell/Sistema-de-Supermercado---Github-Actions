name: CI - Mercado Horizonte

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      executar_demo_cli:
        description: 'Executar simulação da CLI após o build'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  qualidade:
    name: Qualidade (ESLint & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js com cache npm
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

      - name: Verificar tipos TypeScript
        run: npm run typecheck

  testes:
    name: Testes & Cobertura (${{ matrix.os }} / Node ${{ matrix.node-version }})
    needs: qualidade
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22']
        include:
          - os: ubuntu-latest
            node-version: '20'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js ${{ matrix.node-version }} com cache npm
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes e validar cobertura (>= 80%)
        run: npm run test:ci

      - name: Publicar relatório de testes na aba Checks
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Vitest Report (${{ matrix.os }} - Node ${{ matrix.node-version }})
          path: reports/junit.xml
          reporter: jest-junit
          fail-on-error: true

      - name: Enviar artefato de cobertura
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

      - name: Gerar resumo de cobertura no Job Summary
        if: ${{ !cancelled() }}
        run: node scripts/write-coverage-summary.mjs "${{ matrix.os }}" "${{ matrix.node-version }}"

  e2e:
    name: E2E (Playwright / ${{ matrix.os }})
    needs: qualidade
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js com cache npm
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Compilar servidor e frontend web
        run: npm run build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar testes E2E
        run: npm run test:e2e

      - name: Enviar relatório Playwright
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  build:
    name: Build & Demo CLI
    needs: [testes, e2e]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js com cache npm
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Compilar aplicação completa (dist/)
        run: npm run build

      - name: Executar demonstração CLI compilada
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.executar_demo_cli }}
        run: node dist/server/cli.js

      - name: Enviar artefato de build (dist/)
        uses: actions/upload-artifact@v7
        with:
          name: mercado-horizonte-dist
          path: dist/
          retention-days: 7
